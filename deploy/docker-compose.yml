# ============ 网页版部署（Docker + Nginx） ============
#
# 所有部署相关文件都在 deploy/ 目录下，项目根目录只保留源码与配置。
#
# 结构：
#   浏览器 → nginx（80/443，TLS + 托管前端静态文件）→ /api/ → deekai-api（Node:8787）
#
# 用法（在本目录执行）：
#   cd deploy
#   docker compose up -d --build
#
# 路径约定：
#   构建上下文是上一级目录（..），因为要用到 out/web、out/server、package.json
#   配置统一读上一级的 .env（应用配置 + SITE_ADDRESS 都从那里来，只此一份）
#   证书与运行时数据都留在本目录（deploy/certbot、../server-data）

# 显式固定 compose 项目名：否则它默认取“compose 文件所在目录名”，
# 部署目录一改名（deploy/ → 别的）就会变成另一个项目，旧容器变孤儿
name: deekai

services:
  # ---- 能力服务：只提供 /api，不对外暴露端口 ----
  deekai-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: deekai-web:latest
    container_name: deekai-api
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SERVER_PORT: "8787"
      SERVER_DATA_DIR: /app/server-data
    expose:
      - "8787"
    volumes:
      # advanced 版在应用内改配置会写这里；release 版只读
      - ../server-data:/app/server-data

  # ---- Nginx：TLS + 前端静态文件 + 反代 /api ----
  nginx:
    image: nginx:1.27-alpine
    container_name: deekai-nginx
    restart: unless-stopped
    depends_on:
      - deekai-api
    ports:
      - "80:80"
      - "443:443"
    # SITE_ADDRESS 由 .env 提供（这里用 env_file 而不是 compose 变量替换，
    # 因为 compose 的 ${} 只认“compose 文件所在目录的 .env”，而我们要共用上一级那份）
    env_file:
      - ../.env
    environment:
      # 模板渲染时只替换 SITE_ADDRESS，避免误伤 nginx 自己的 $host / $uri 等
      NGINX_ENVSUBST_FILTER: SITE_ADDRESS
    volumes:
      # 前端产物：本机 build:web 的产物直接挂进来（宿主上只有这一份）
      - ../out/web:/usr/share/nginx/html:ro
      # 站点配置模板（官方入口脚本会 envsubst 后放到 /etc/nginx/conf.d/default.conf）
      - ./nginx/templates:/etc/nginx/templates:ro
      # 证书：由 certbot 容器维护，nginx 只读使用
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    # ⚠️ 不要覆盖 command / entrypoint！
    # nginx 官方镜像的入口脚本有判断：只有第一个参数是 nginx / nginx-debug 时，
    # 才会执行 /docker-entrypoint.d/ 下的脚本 —— 模板渲染（20-envsubst-on-templates.sh）
    # 就在里面。一旦覆盖成 /bin/sh -c "..."，模板不会被处理，nginx 会退回镜像自带的默认配置
    # （现象：/api/* 全 404、80 端口不跳转、443 不监听）。
    #
    # 证书续期后让 nginx 加载新证书（二选一）：
    #   1) 手动：docker compose exec nginx nginx -s reload
    #   2) 宿主机 crontab 每周自动：
    #      0 4 * * 1 cd /opt/deekai/deploy && docker compose exec -T nginx nginx -s reload

  # ---- 证书续期：每 12 小时检查一次（Let's Encrypt 证书有效期 90 天）----
  certbot:
    image: certbot/certbot
    container_name: deekai-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
